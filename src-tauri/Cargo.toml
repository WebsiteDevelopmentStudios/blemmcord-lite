[package]
name = "blemmcord-lite"
version = "0.1.0"
description = "A lightweight native Rust Discord-inspired desktop client"
authors = ["WebsiteDevelopmentStudios"]
edition = "2021"

[dependencies]
eframe = { version = "0.32", features = ["wgpu"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
