[package]
name = "blemmcord-lite"
version = "0.1.0"
description = "A lightweight desktop shell for the official Discord web client"
authors = ["WebsiteDevelopmentStudios"]
edition = "2021"

[lib]
name = "blemmcord_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
