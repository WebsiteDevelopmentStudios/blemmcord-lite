<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202225" />
    <title>Blemmcord Lite</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", sans-serif;
        background: #202225;
        color: #f2f3f5;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(88, 101, 242, .18), transparent 55%),
          #202225;
      }

      main {
        width: min(440px, calc(100% - 40px));
        padding: 36px;
        text-align: center;
        border: 1px solid #3f4147;
        border-radius: 18px;
        background: rgba(43, 45, 49, .94);
        box-shadow: 0 24px 80px rgba(0, 0, 0, .28);
      }

      .mark {
        width: 58px;
        height: 58px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #5865f2;
        color: white;
        font-size: 25px;
        font-weight: 800;
      }

      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0; color: #b5bac1; line-height: 1.6; }
      .hint { margin-top: 22px; font-size: 12px; color: #949ba4; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">B</div>
      <h1>Blemmcord Lite</h1>
      <p>The desktop shell is ready. Discord will open in its secure WebView2 window.</p>
      <p class="hint">If this page remains visible, check your internet connection and the app configuration.</p>
    </main>
  </body>
</html>
